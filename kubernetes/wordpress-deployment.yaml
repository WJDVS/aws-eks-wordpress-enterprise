apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  labels:
    app: wordpress
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wordpress
  template:
    metadata:
      labels:
        app: wordpress
    spec:
      serviceAccountName: wordpress
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: wordpress
      containers:
        - name: wordpress
          image: wordpress:7.1.3-php8.3-apache
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          ports:
            - containerPort: 80
              name: wordpress
          env:
            - name: WORDPRESS_DB_HOST
              value: "aws-eks-wordpress-db.cynq6gqcsg2c.us-east-1.rds.amazonaws.com"
            - name: WORDPRESS_DB_NAME
              value: "wordpress"
            - name: WORDPRESS_DB_USER
              valueFrom:
                secretKeyRef:
                  name: wordpress-db-secret
                  key: WORDPRESS_DB_USER
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wordpress-db-secret
                  key: WORDPRESS_DB_PASSWORD
            - name: WORDPRESS_CONFIG_EXTRA
              value: |
                if (isset($_SERVER['HTTP_HOST'])) {
                  $cf_proto = isset($_SERVER['HTTP_CLOUDFRONT_FORWARDED_PROTO']) ? $_SERVER['HTTP_CLOUDFRONT_FORWARDED_PROTO'] : '';
                  $lb_proto = isset($_SERVER['HTTP_X_FORWARDED_PROTO']) ? $_SERVER['HTTP_X_FORWARDED_PROTO'] : '';
                  $wp_scheme = ($cf_proto === 'https' || $lb_proto === 'https') ? 'https' : 'http';
                  if ($wp_scheme === 'https') { $_SERVER['HTTPS'] = 'on'; }
                  define('WP_HOME', $wp_scheme . '://' . $_SERVER['HTTP_HOST']);
                  define('WP_SITEURL', $wp_scheme . '://' . $_SERVER['HTTP_HOST']);
                }
                define('WP_REDIS_HOST', 'aws-eks-wordpress-redis.fzrahh.ng.0001.use1.cache.amazonaws.com');
                define('WP_REDIS_PORT', 6379);
                define('WP_REDIS_CLIENT', 'predis');
                define('WP_REDIS_DATABASE', 0);
                define('WP_REDIS_TIMEOUT', 1);
                define('WP_REDIS_READ_TIMEOUT', 1);
                define('WP_CACHE_KEY_SALT', 'wp_eks_');
          volumeMounts:
            - name: wordpress-persistent-storage
              mountPath: /var/www/html
      volumes:
        - name: wordpress-persistent-storage
          persistentVolumeClaim:
            claimName: wordpress-efs-pvc