apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  labels:
    app: wordpress
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wordpress
  template:
    metadata:
      labels:
        app: wordpress
    spec:
      containers:
        - name: wordpress
          image: wordpress:latest
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          ports:
            - containerPort: 80
              name: wordpress
          env:
            - name: WORDPRESS_DB_HOST
              value: "aws-eks-wordpress-db.cynq6gqcsg2c.us-east-1.rds.amazonaws.com"
            - name: WORDPRESS_DB_NAME
              value: "wordpress"
            - name: WORDPRESS_DB_USER
              value: "admin"
            - name: WORDPRESS_DB_PASSWORD
              value: "SecureWordPressAdminPassword2026!"
            - name: WORDPRESS_DEBUG
              value: "1"
            - name: WORDPRESS_CONFIG_EXTRA
              value: |
                define('WP_DEBUG', true);
                define('WP_DEBUG_DISPLAY', true);
                define('WP_DEBUG_LOG', true);
          volumeMounts:
            - name: wordpress-persistent-storage
              mountPath: /var/www/html
      volumes:
        - name: wordpress-persistent-storage
          persistentVolumeClaim:
            claimName: wordpress-efs-pvc
                   
