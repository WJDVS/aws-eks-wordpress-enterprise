name: Terraform

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"

# Needed so the job can request a GitHub OIDC token for AWS.
permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.16.3"
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"

# Never run two Terraform jobs at the same time.
concurrency:
  group: terraform
  cancel-in-progress: false

jobs:
  plan:
    name: Validate and plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TF_VAR_db_password: ${{ secrets.TF_VAR_db_password }}
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: false

      - name: Get temporary AWS credentials (read-only role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize
        run: terraform init -input=false

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan -input=false -lock-timeout=60s

  apply:
    name: Apply (needs approval)
    needs: plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      TF_VAR_db_password: ${{ secrets.TF_VAR_db_password }}
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: false

      - name: Get temporary AWS credentials (apply role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Initialize
        run: terraform init -input=false

      - name: Apply
        run: terraform apply -auto-approve -input=false -lock-timeout=60s